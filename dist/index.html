inearInfrastructureObject","RoadObject","StructuralElement","ControlNetwork","ControlPoint","Benchmark","CoordinateSystem","HeightSystem","Instrument","AccuracyRequirement","Tolerance","Deviation","Measurement","RegulatoryDocument","TechnicalReport","CartographicProduct","DigitalCartographicData","GISObject","RoadSurveyObject"],targets:{terms:119,collections:16,objprops:18,datprops:13,bridges:6},map:{layout:"cluster",corner:"bottom-right",width:240,height:180,zoomThresholds:[.4,.8,1.6]},rootClasses:["GeodeticEntity"]},Zx=[{name:"demo-geodeticont-kz.ttl",text:'@prefix :        <http://ontogeo.kz/geodeticont-kz#> .\n@prefix owl:     <http://www.w3.org/2002/07/owl#> .\n@prefix rdf:     <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .\n@prefix rdfs:    <http://www.w3.org/2000/01/rdf-schema#> .\n@prefix xsd:     <http://www.w3.org/2001/XMLSchema#> .\n@prefix skos:    <http://www.w3.org/2004/02/skos/core#> .\n@prefix dcterms: <http://purl.org/dc/terms/> .\n@prefix sh:      <http://www.w3.org/ns/shacl#> .\n@prefix ifc:     <http://www.buildingsmart-tech.org/ifcOWL/IFC4#> .\n@prefix geo:     <http://www.opengis.net/ont/geosparql#> .\n@prefix doc:     <http://ontogeo.kz/geodeticont-kz/doc/> .\n\n##############################################################################\n#\n#    Ontology\n#\n##############################################################################\n\n<http://ontogeo.kz/geodeticont-kz> rdf:type owl:Ontology ;\n    owl:versionIRI <http://ontogeo.kz/geodeticont-kz/0.9-demo> ;\n    owl:versionInfo "0.9-demo-synthetic" ;\n    dcterms:title "GeodeticOnt-KZ (СИНТЕТИЧЕСКИЙ ДЕМОНАБОР)"@ru ;\n    dcterms:title "GeodeticOnt-KZ (SYNTHETIC DEMO DATASET)"@en ;\n    dcterms:license <https://creativecommons.org/licenses/by/4.0/> ;\n    dcterms:created "2026-09-20"^^xsd:date ;\n    rdfs:comment "ВНИМАНИЕ: набор сгенерирован скриптом build/make_demo_data.py для проверки визуализатора OntoLens. Определения вымышлены и не являются нормативными. Реальный пакет GeodeticOnt-KZ собирается по заданию v2.2."@ru ;\n    rdfs:comment "WARNING: synthetic dataset generated to exercise the OntoLens viewer. Definitions are invented and carry no normative force."@en .\n\n\n##############################################################################\n#\n#    Object Properties\n#\n##############################################################################\n\n###  http://ontogeo.kz/geodeticont-kz#regulatedBy\n:regulatedBy rdf:type owl:ObjectProperty ;\n    rdfs:domain :Deviation ;\n    rdfs:range :RegulatoryDocument ;\n    skos:prefLabel "регулируется документом"@ru ;\n    skos:prefLabel "regulated by"@en .\n\n###  http://ontogeo.kz/geodeticont-kz#appliesTo\n:appliesTo rdf:type owl:ObjectProperty ;\n    rdfs:domain :AccuracyRequirement ;\n    rdfs:range :ConstructionObject ;\n    skos:prefLabel "применяется к"@ru ;\n    skos:prefLabel "applies to"@en .\n\n###  http://ontogeo.kz/geodeticont-kz#hasMeasurement\n:hasMeasurement rdf:type owl:ObjectProperty ;\n    rdfs:domain :ConstructionObject ;\n    rdfs:range :Measurement ;\n    skos:prefLabel "имеет измерение"@ru ;\n    skos:prefLabel "has measurement"@en .\n\n###  http://ontogeo.kz/geodeticont-kz#hasTolerance\n:hasTolerance rdf:type owl:ObjectProperty ;\n    rdfs:domain :ConstructionObject ;\n    rdfs:range :Tolerance ;\n    skos:prefLabel "имеет допуск"@ru ;\n    skos:prefLabel "has tolerance"@en .\n\n###  http://ontogeo.kz/geodeticont-kz#hasDeviation\n:hasDeviation rdf:type owl:ObjectProperty ;\n    rdfs:domain :ConstructionObject ;\n    rdfs:range :Deviation ;\n    skos:prefLabel "имеет отклонение"@ru ;\n    skos:prefLabel "has deviation"@en .\n\n###  http://ontogeo.kz/geodeticont-kz#exceedsTolerance\n:exceedsTolerance rdf:type owl:ObjectProperty ;\n    rdfs:domain :Deviation ;\n    rdfs:range :Tolerance ;\n    skos:prefLabel "превышает допуск"@ru ;\n    skos:prefLabel "exceeds tolerance"@en .\n\n###  http://ontogeo.kz/geodeticont-kz#performedAtStage\n:performedAtStage rdf:type owl:ObjectProperty ;\n    rdfs:domain :GeodeticWork ;\n    rdfs:range :ConstructionObject ;\n    skos:prefLabel "выполняется на стадии"@ru ;\n    skos:prefLabel "performed at stage"@en .\n\n###  http://ontogeo.kz/geodeticont-kz#documentedBy\n:documentedBy rdf:type owl:ObjectProperty ;\n    rdfs:domain :GeodeticWork ;\n    rdfs:range :TechnicalReport ;\n    skos:prefLabel "документируется"@ru ;\n    skos:prefLabel "documented by"@en .\n\n###  http://ontogeo.kz/geodeticont-kz#providesEvidenceFor\n:providesEvidenceFor rdf:type owl:ObjectProperty ;\n    rdfs:domain :Measurement ;\n    rdfs:range :TechnicalReport ;\n    skos:prefLabel "служит подтверждением для"@ru ;\n    skos:prefLabel "provides evidence for"@en .\n\n###  http://ontogeo.kz/geodeticont-kz#linkedToBIMElement\n:linkedToBIMElement rdf:type owl:ObjectProperty ;\n    rdfs:domain :ConstructionObject ;\n    rdfs:range ifc:IfcProduct ;\n    skos:prefLabel "связан с элементом BIM"@ru ;\n    skos:prefLabel "linked to BIM element"@en .\n\n###  http://ontogeo.kz/geodeticont-kz#linkedToGISObject\n:linkedToGISObject rdf:type owl:ObjectProperty ;\n    rdfs:domain :ConstructionObject ;\n    rdfs:range :GISObject ;\n    skos:prefLabel "связан с объектом ГИС"@ru ;\n    skos:prefLabel "linked to GIS object"@en .\n\n###  http://ontogeo.kz/geodeticont-kz#duplicatesRequirement\n:duplicatesRequirement rdf:type owl:ObjectProperty ;\n    rdfs:domain skos:Concept ;\n    rdfs:range skos:Concept ;\n    skos:prefLabel "дублирует требование"@ru ;\n    skos:prefLabel "duplicates requirement"@en .\n\n###  http://ontogeo.kz/geodeticont-kz#hasLegacyEquivalent\n:hasLegacyEquivalent rdf:type owl:ObjectProperty ;\n    rdfs:domain skos:Concept ;\n    rdfs:range skos:Concept ;\n    skos:prefLabel "имеет устаревший эквивалент"@ru ;\n    skos:prefLabel "has legacy equivalent"@en .\n\n###  http://ontogeo.kz/geodeticont-kz#replacesTerm\n:replacesTerm rdf:type owl:ObjectProperty ;\n    rdfs:domain skos:Concept ;\n    rdfs:range skos:Concept ;\n    skos:prefLa latoryDocument ;\n    skos:prefLabel "Глоссарий геодезических терминов"@ru ;\n    dcterms:title "Глоссарий геодезических терминов (справочный источник)"@ru ;\n    :documentStatus "тезаурусный источник" ;\n    :documentYear "2008"^^xsd:gYear ;\n    dcterms:identifier "d14" .\n\n###  http://ontogeo.kz/geodeticont-kz/doc/d15\ndoc:d15 rdf:type :RegulatoryDocument ;\n    skos:prefLabel "Экспертное мнение"@ru ;\n    dcterms:title "Экспертное мнение специалиста (не документ)"@ru ;\n    :documentStatus "unverified" ;\n    dcterms:identifier "d15" .\n\n###  http://ontogeo.kz/geodeticont-kz/doc/d16\ndoc:d16 rdf:type :RegulatoryDocument ;\n    skos:prefLabel "СН РК 3.03-01-2013"@ru ;\n    dcterms:title "Автомобильные дороги"@ru ;\n    :documentStatus "действующий" ;\n    :documentYear "2013"^^xsd:gYear ;\n    dcterms:identifier "d16" .\n\n###  http://ontogeo.kz/geodeticont-kz/doc/d17\ndoc:d17 rdf:type :RegulatoryDocument ;\n    skos:prefLabel "СП РК 2.04-107-2013"@ru ;\n    dcterms:title "Строительная климатология"@ru ;\n    :documentStatus "действующий" ;\n    :documentYear "2013"^^xsd:gYear ;\n    dcterms:identifier "d17" .\n\n###  http://ontogeo.kz/geodeticont-kz/doc/d18\ndoc:d18 rdf:type :RegulatoryDocument ;\n    skos:prefLabel "СТ РК ISO 19115-2010"@ru ;\n    dcterms:title "Географическая информация. Метаданные"@ru ;\n    :documentStatus "тезаурусный источник" ;\n    :documentYear "2010"^^xsd:gYear ;\n    dcterms:identifier "d18" .\n\n###  http://ontogeo.kz/geodeticont-kz/doc/d19\ndoc:d19 rdf:type :RegulatoryDocument ;\n    skos:prefLabel "МСН 3.01-01-2010"@ru ;\n    dcterms:title "Межгосударственные строительные нормы (отменён)"@ru ;\n    :documentStatus "отменён" ;\n    :documentYear "2010"^^xsd:gYear ;\n    dcterms:identifier "d19" .\n\n'},{name:"demo-geodeticont-kz-shapes.ttl",text:'@prefix :        <http://ontogeo.kz/geodeticont-kz#> .\n@prefix owl:     <http://www.w3.org/2002/07/owl#> .\n@prefix rdf:     <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .\n@prefix rdfs:    <http://www.w3.org/2000/01/rdf-schema#> .\n@prefix xsd:     <http://www.w3.org/2001/XMLSchema#> .\n@prefix skos:    <http://www.w3.org/2004/02/skos/core#> .\n@prefix dcterms: <http://purl.org/dc/terms/> .\n@prefix sh:      <http://www.w3.org/ns/shacl#> .\n@prefix ifc:     <http://www.buildingsmart-tech.org/ifcOWL/IFC4#> .\n@prefix geo:     <http://www.opengis.net/ont/geosparql#> .\n@prefix doc:     <http://ontogeo.kz/geodeticont-kz/doc/> .\n\n##############################################################################\n#\n#    SHACL shapes (1 full + 6 placeholders)\n#\n##############################################################################\n\n:DeviationShape rdf:type sh:NodeShape ;\n    sh:targetClass :Deviation ;\n    rdfs:label "Отклонение не превышает допустимого значения"@ru ;\n    sh:property [\n        sh:path :measuredValue ;\n        sh:datatype xsd:decimal ;\n        sh:lessThanOrEquals :permittedValue ;\n        sh:message "measuredValue must not exceed permittedValue"@en ;\n    ] .\n\n:LimitDeviationShape rdf:type sh:NodeShape ;\n    sh:targetClass :LimitDeviation ;\n    rdfs:label "Предельное отклонение — скалярный порог"@ru ;\n    sh:property [\n        sh:path :permittedValue ;\n        sh:datatype xsd:decimal ;\n        sh:minCount 1 ;\n    ] .\n\n:AccuracyClassShape rdf:type sh:NodeShape ;\n    sh:targetClass :AccuracyClass ;\n    rdfs:comment "TODO: resolves to a table parameterised by accuracy class / network order; value not confirmed by expert (workbook sheet 2)"@en .\n\n:CoordinateTransformationShape rdf:type sh:NodeShape ;\n    sh:targetClass :CoordinateTransformation ;\n    rdfs:comment "TODO: resolves to a table parameterised by zone and transformation parameters; value not confirmed by expert"@en .\n\n:PavementThicknessShape rdf:type sh:NodeShape ;\n    sh:targetClass :PavementThickness ;\n    rdfs:comment "TODO: resolves to a table parameterised by nominal size range; value not confirmed by expert"@en .\n\n:MisclosureShape rdf:type sh:NodeShape ;\n    sh:targetClass :Misclosure ;\n    rdfs:comment "TODO: limit is a function of traverse length; formula placeholder, not confirmed"@en .\n\n:SettlementShape rdf:type sh:NodeShape ;\n    rdfs:comment "TODO: limit delegated to geotechnical norms; no targetClass assigned yet"@en .\n'}],Qx={id:"geont-kz",title:"GeOnt-KZ — геотехника (онтология-предшественник)",languages:["ru","kk","en"],labelProperties:["http://www.w3.org/2000/01/rdf-schema#label","http://www.w3.org/2004/02/skos/core#prefLabel"],definitionProperties:["http://www.w3.org/2000/01/rdf-schema#comment","http://www.w3.org/2004/02/skos/core#definition"],minDefinitionLength:20,targets:null},Jx=[{name:"demo-legacy-geont.ttl",text:'@prefix :        <http://ontogeo.kz/geont-kz#> .\n@prefix owl:     <http://www.w3.org/2002/07/owl#> .\n@prefix rdf:     <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .\n@prefix rdfs:    <http://www.w3.org/2000/01/rdf-schema#> .\n@prefix xsd:     <http://www.w3.org/2001/XMLSchema#> .\n@prefix skos:    <http://www.w3.org/2004/02/skos/core#> .\n@prefix dcterms: <http://purl.org/dc/terms/> .\n@prefix ifc:     <http://www.buildingsmart-tech.org/ifcOWL/IFC4#> .\n@prefix geocore: <http://www.geoscience.org/geocore#> .\n@prefix ontolex: <http://www.w3.org/ns/lemon/ontolex#> .\n\n##############################################################################\n#\n#    Ontology\n#\n##############################################################################\n\n<http://ontogeo.kz/geont-kz> rdf:type owl:Ontology ;\n    owl:imports <http://www.w3.org/2004/02/skos/core> ;\n    owl:imports <http://www.buildingsmart-tech.org/ifcOWL/IFC4> ;\n    owl:versionInfo "0.4-demo-defective" ;\n    rdfs:label "GeOnt-KZ (СИНТЕТИЧЕСКИЙ ДЕФЕКТНЫЙ ДЕМОНАБОР)"@ru ;\n    rdfs:comment "ВНИМАНИЕ: сгенерировано build/make_demo_data.py. Набор намеренно воспроизводит типы дефектов, найденные в настоящем GeOnt-KZ.ttl (тег kz вместо kk, классы-сироты, множественные родители, провенанс литералом, свойства без домена и диапазона, категориальные ошибки иерархии). Определения вымышлены."@ru .\n\n\n##############################################################################\n#\n#    Object Properties\n#\n##############################################################################\n\n###  http://ontogeo.kz/geont-kz#hasSoilType\n:hasSoilType rdf:type owl:ObjectProperty ;\n    rdfs:domain :Soil ;\n    rdfs:range :Soil ;\n    rdfs:label "тип грунта"@kz .\n\n###  http://ontogeo.kz/geont-kz#hasStrength\n:hasStrength rdf:type owl:ObjectProperty ;\n    rdfs:label "прочность"@kz .\n\n###  http://ontogeo.kz/geont-kz#hasIceContent\n:hasIceContent rdf:type owl:ObjectProperty .\n\n###  http://ontogeo.kz/geont-kz#isLocatedIn\n:isLocatedIn rdf:type owl:ObjectProperty ;\n    rdfs:domain :Borehole ;\n    rdfs:label "расположен в"@kz .\n\n###  http://ontogeo.kz/geont-kz#hasTestResult\n:hasTestResult rdf:type owl:ObjectProperty ;\n    rdfs:range :FieldTest .\n\n###  http://ontogeo.kz/geont-kz#relatesToDocument\n:relatesToDocument rdf:type owl:ObjectProperty .\n\n###  http://ontogeo.kz/geont-kz#hasSubsoil\n:hasSubsoil rdf:type owl:ObjectProperty ;\n    rdfs:domain :Foundation ;\n    rdfs:range :Soil .\n\n###  http://ontogeo.kz/geont-kz#measuredAt\n:measuredAt rdf:type owl:ObjectProperty ;\n    rdfs:label "измерено на"@kz .\n\n\n##############################################################################\n#\n#    Data Properties\n#\n##############################################################################\n\n###  http://ontogeo.kz/geont-kz#hasValue\n:hasValue rdf:type owl:DatatypeProperty ;\n    rdfs:label "значение"@ru .\n\n###  http://ontogeo.kz/geont-kz#hasUnit\n:hasUnit rdf:type owl:DatatypeProperty .\n\n###  http://ontogeo.kz/geont-kz#hasDepth\n:hasDepth rdf:type owl:DatatypeProperty ;\n    rdfs:label "глубина"@ru .\n\n\n##############################################################################\n#\n#    Classes\n#\n##############################################################################\n\n###  http://ontogeo.kz/geont-kz#GeotechnicalEntity\n:GeotechnicalEntity rdf:type owl:Class ;\n    rdfs:label "GeotechnicalEntity"@en .\n\n###  http://ontogeo.kz/geont-kz#GeotechnicalProperty\n:GeotechnicalProperty rdf:type owl:Class ;\n    rdfs:label "GeotechnicalProperty"@en .\n\n###  http://ontogeo.kz/geont-kz#GeotechnicalWork\n:GeotechnicalWork rdf:type owl:Class ;\n    rdfs:label "GeotechnicalWork"@en .\n\n###  http://ontogeo.kz/geont-kz#StructuralEntity\n:StructuralEntity rdf:type owl:Class ;\n    rdfs:label "StructuralEntity"@en .\n\n###  http://ontogeo.kz/geont-kz#FieldTest\n:FieldTest rdf:type owl:Class ;\n    rdfs:label "FieldTest"@en .\n\n###  http://ontogeo.kz/geont-kz#FieldWork\n:FieldWork rdf:type owl:Class ;\n    rdfs:label "FieldWork"@en .\n\n###  http://ontogeo.kz/geont-kz#SeismicEntity\n:SeismicEntity rdf:type owl:Class ;\n    rdfs:label "SeismicEntity"@en .\n\n###  http://ontogeo.kz/geont-kz#LimitState\n:LimitState rdf:type owl:Class ;\n    rdfs:label "LimitState"@en .\n\n###  http://ontogeo.kz/geont-kz#LoadEntity\n:LoadEntity rdf:type owl:Class ;\n    rdfs:label "LoadEntity"@en .\n\n###  http://ontogeo.kz/geont-kz#QualityEntity\n:QualityEntity rdf:type owl:Class ;\n    rdfs:label "QualityEntity"@en .\n\n###  http://ontogeo.kz/geont-kz#Deformation\n:Deformation rdf:type owl:Class ;\n    rdfs:label "Deformation"@en .\n\n###  http://ontogeo.kz/geont-kz#Geotechnical_category\n:Geotechnical_category rdf:type owl:Class ;\n    rdfs:label "geotechnical category"@ru ;\n    rdfs:label "geotechnical category"@kz .\n\n###  http://ontogeo.kz/geont-kz#Soil_classification_system\n:Soil_classification_system rdf:type owl:Class ;\n    rdfs:label "soil classification system"@ru ;\n    rdfs:label "soil classification system"@kz .\n\n###  http://ontogeo.kz/geont-kz#Laboratory_test\n:Laboratory_test rdf:type owl:Class ;\n    rdfs:label "laboratory test"@ru ;\n    rdfs:label "laboratory test"@kz .\n\n###  http://ontogeo.kz/geont-kz#Engineeri риводятся к базовым, так что «геодезиялык тирек» найдёт «геодезиялық тірек желісі». Флажок «нестрогий поиск» добавляет поиск с опечатками."],["3. Проверьте карточку","Метки на трёх языках рядом; отсутствующая метка помечена красным. Плашки «авторский перевод» и «подтверждён источником» показывают, откуда взялась метка. Ниже — определения, родитель, блок, документ-источник со статусом и SHACL-ограничение человеческим языком."],["4. Посмотрите окрестность","Граф под карточкой: предки до корня, потомки, братья, документ и шейп. Клик по узлу — переход. Колесо мыши масштабирует, перетаскивание двигает, Esc возвращает обзор. Кнопка SVG сохраняет именно этот фрагмент для статьи."],["Поставьте оценку","Справа — «Ваша оценка»: верно, исправить, удалить, не мой домен, дубль (клавиши 1–5). Исправление пишется в поле, а не словом «верно» или «дұрыс» — для подтверждения есть оценка «Верно». «Сохранить и далее» (Ctrl+Enter) переходит к следующему термину, N — к ближайшему непроверенному. Счётчик в шапке показывает, сколько пройдено. В конце — ссылка CSV внизу панели: этот файл вливается в мастер-таблицу скриптом."],["5. Проверьте модель целиком","Вкладка «Диагностика»: {n} проверок с числами. Красный квадрат — ошибка, оранжевый — предупреждение, серый — справочно, зелёный — ни одного случая. Клик по строке списка открывает карточку сущности. Справа — метрики файла; если в профиле заданы целевые значения, рядом появляется «цель — факт»."],["6. Выгрузите результат","METRICS.md — таблица показателей для статьи. CSV — все найденные дефекты со списком сущностей. SVG — фрагмент графа с редактируемым текстом. В опубликованной по ссылке версии сохранение нужно подтвердить в окне платформы; если оно недоступно, откроется окно с текстом для копирования."]],helpKeys:[["/","встать в поиск"],["↑ ↓ ← →","дерево терминов"],["1–5","оценка"],["Ctrl+Enter","сохранить и далее"],["N","следующий непроверенный"],["d","переключить «Термины ↔ Диагностика»"],["Esc","вернуть обзор графа, закрыть окно"],["
